CONFIG_TRANSPORT_BIS=y
CONFIG_AUDIO_DEV=2

# Fuente de audio: USB Audio (nunca I2S en esta configuración)
CONFIG_AUDIO_SOURCE_USB=y

CONFIG_BT_CAP_INITIATOR=y
CONFIG_BT_AUDIO=y

CONFIG_BT_DEVICE_APPEARANCE=2181

CONFIG_BT_ISO_BROADCASTER=y

CONFIG_BT_BAP_BROADCAST_SOURCE=y

CONFIG_BT_BAP_BROADCAST_SRC_STREAM_COUNT=2

CONFIG_BT_ISO_MAX_CHAN=2

CONFIG_BT_ISO_MAX_BIG=2
CONFIG_BT_EXT_ADV_MAX_ADV_SET=3

CONFIG_LC3_ENC_CHAN_MAX=2
CONFIG_AUDIO_ENCODE_CHANNELS_MAX=2
CONFIG_ENTROPY_GENERATOR=y

## USB CDC-ACM: canal de control JSON para WebSerial ##
CONFIG_USB_CDC_ACM=y
CONFIG_USB_COMPOSITE_DEVICE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_SERIAL_CTRL=y
# LOG_MODE_IMMEDIATE eliminado: causaba overflow de la cola de eventos NRFX USB
# al arrancar el BIG ISO (~t=1.2s) → pérdida de muestras PCM → silencio en sinks.
# Si se necesita depurar el scanner, usar LOG_MODE_DEFERRED (por defecto).
CONFIG_USB_WORKQUEUE_STACK_SIZE=4096

## ACS: Source como Peripheral (sinks inician conexión ACL hacia nosotros) ##
# El SDC no permite scanner con BIG ISO activo → arquitectura invertida:
# los sinks (BIG SYNC RECEIVER) sí pueden iniciar ACL mientras reciben BIG.
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_MAX_CONN=4
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_JSON_LIBRARY=y
CONFIG_CTRL_CENTRAL=y

# SMP + settings requeridos por bt_mgmt cuando BT_CENTRAL=y
CONFIG_BT_SMP=y
CONFIG_SETTINGS=y
CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=2048
# No crear bonds: el source no guarda ni pide claves de emparejamiento.
# Evita que los sinks acumulen bonds obsoletos tras un borrado de NVS.
CONFIG_BT_BONDABLE=n
# bt_mgmt_scan_for_conn.c requiere CSIP coordinator cuando BT_CENTRAL=y
CONFIG_BT_CSIP_SET_COORDINATOR=y
CONFIG_BT_GATT_AUTO_DISCOVER_CCC=y
