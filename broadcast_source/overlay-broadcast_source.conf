CONFIG_TRANSPORT_BIS=y
CONFIG_AUDIO_DEV=2

# Fuente de audio: USB Audio (nunca I2S en esta configuración)
CONFIG_AUDIO_SOURCE_USB=y

CONFIG_BT_CAP_INITIATOR=y
CONFIG_BT_AUDIO=y

CONFIG_BT_DEVICE_APPEARANCE=2181

CONFIG_BT_ISO_BROADCASTER=y

CONFIG_BT_BAP_BROADCAST_SOURCE=y

CONFIG_BT_BAP_BROADCAST_SRC_STREAM_COUNT=2

CONFIG_BT_ISO_MAX_CHAN=2

CONFIG_BT_ISO_MAX_BIG=2
CONFIG_BT_EXT_ADV_MAX_ADV_SET=2

CONFIG_LC3_ENC_CHAN_MAX=2
CONFIG_AUDIO_ENCODE_CHANNELS_MAX=2
CONFIG_ENTROPY_GENERATOR=y

## ACS Central: BT ACL connection to sinks ##
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_MAX_CONN=4
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_JSON_LIBRARY=y
CONFIG_CTRL_CENTRAL=y

# SMP + settings requeridos por bt_mgmt cuando BT_CENTRAL=y
CONFIG_BT_SMP=y
CONFIG_SETTINGS=y
CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=2048
# bt_mgmt_scan_for_conn.c requiere CSIP coordinator cuando BT_CENTRAL=y
CONFIG_BT_CSIP_SET_COORDINATOR=y
CONFIG_BT_GATT_AUTO_DISCOVER_CCC=y
