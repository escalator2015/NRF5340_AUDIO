sample:
  name: nRF5340 Audio application
  description: LE Audio and Auracast implementation example
tests:
  applications.nrf5340_audio.headset_broadcast_sink_release_usb:
    integration_platforms:
      - nrf5340_audio_dk/nrf5340/cpuapp
      - nrf5340dk/nrf5340/cpuapp
    platform_allow:
      - nrf5340_audio_dk/nrf5340/cpuapp
      - nrf5340dk/nrf5340/cpuapp
    sysbuild: true
    build_only: true
    tags:
      - ci_build
      - sysbuild
      - ci_applications_nrf5340_audio
    extra_args:
      - FILE_SUFFIX=release
      - EXTRA_CONF_FILE=broadcast_sink/overlay-broadcast_sink.conf
  applications.nrf5340_audio.gateway_broadcast_source_release_i2s:
    integration_platforms:
      - nrf5340_audio_dk/nrf5340/cpuapp
      - nrf5340dk/nrf5340/cpuapp
    platform_allow:
      - nrf5340_audio_dk/nrf5340/cpuapp
      - nrf5340dk/nrf5340/cpuapp
    sysbuild: true
    build_only: true
    tags:
      - ci_build
      - sysbuild
      - ci_applications_nrf5340_audio
    extra_args:
      - FILE_SUFFIX=release
      - EXTRA_CONF_FILE=broadcast_source/overlay-broadcast_source.conf

