#
# nRF21540 FEM configuration — solo para BT40NE (Fanstel), modo GPIO-only
# Aplicado únicamente desde el preset build_bt40ne via
# ipc_radio_EXTRA_CONF_FILE en CMakePresets.json
#
# Modo GPIO-only: el MPSL controla TX_EN, RX_EN y PDN via GPIO
# en cada slot BLE. Suficiente para BLE audio.
# Para control de potencia TX por registro SPI, activar
# CONFIG_MPSL_FEM_NRF21540_GPIO_SPI=y y añadir el nodo SPI al overlay.
#

CONFIG_MPSL_FEM=y
CONFIG_MPSL_FEM_NRF21540_GPIO=y

# POUTA = 20 dB, MODE pin = LOW.
CONFIG_MPSL_FEM_NRF21540_TX_GAIN_DB=20

# Target potencia en antena = 20 dBm => MPSL fija radio a 0 dBm.
# Si el PA amplifica: 20 dBm en antena (buen alcance).
# Si el PA no amplifica: 0 dBm - insercion loss (~2 dB) = -2 dBm => alcance decente.
# Antes teniamos target=0 => radio a -20 dBm => desastre si PA falla.
CONFIG_BT_CTLR_TX_PWR_ANTENNA=20
